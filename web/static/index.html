<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1214">
<title>Stage Bulbs</title>
<link rel="stylesheet" href="app.css">
<script src="app.js"></script>
<script defer src="vendor/alpine.min.js"></script>
</head>
<body x-data="app()" x-init="init()" @keydown.escape.window="closeSheet(); groupPopup = null; menuFor = null; dmxPopup = false; assign = null">

<!-- ================= first run / login ================= -->
<template x-if="loaded && !session.authenticated">
  <div class="login">
    <form @submit.prevent="session.setup_needed ? doSetup() : doLogin()">
      <h1 x-text="session.setup_needed ? 'Set up Stage Bulbs' : 'Stage Bulbs'"></h1>
      <p class="muted" x-show="session.setup_needed">Choose the password venue staff will use for this page.</p>
      <label class="field"><span>Password</span>
        <input id="pw" type="password" x-model="pw" autocomplete="current-password" required></label>
      <template x-if="session.setup_needed">
        <div class="stack">
          <label class="field"><span>Repeat password</span>
            <input id="pw2" type="password" x-model="pw2" autocomplete="new-password" required></label>
          <p class="muted" style="margin:0">Show network (used later for pairing bulbs; optional)</p>
          <label class="field"><span>Network name (SSID)</span><input id="ssid" type="text" x-model="ssid"></label>
          <label class="field"><span>Network password</span><input id="wifipw" type="password" x-model="wifiPw"></label>
        </div>
      </template>
      <p class="error-text" x-show="loginError" x-text="loginError"></p>
      <button class="btn primary" type="submit" x-text="session.setup_needed ? 'Save and continue' : 'Log in'"></button>
    </form>
  </div>
</template>

<!-- ================= app ================= -->
<template x-if="loaded && session.authenticated && cfg">
<div>
  <header class="top">
    <div class="wrap">
      <div class="brand">Stage Bulbs</div>
      <div class="health">
        <button type="button" class="pill pill-btn" :class="dmxPillClass()" @click="dmxPopup = true" title="DMX input details and on/off">
          <span class="dot"></span><span x-text="dmxPillText()"></span></button>
        <span class="pill" :class="onlineCount() === bulbList().length ? 'ok' : 'warn'"><span class="dot"></span>
          <span x-text="onlineCount() + '/' + bulbList().length + ' online'"></span></span>
        <span class="pop-anchor" x-show="live && live.sender.latency_p95_ms != null"
              @mouseenter="delayPop = true" @mouseleave="delayPop = false" @click.outside="delayPop = false">
          <button type="button" class="pill pill-btn" @click="delayPop = !delayPop" :aria-expanded="delayPop"
                  x-text="'delay ' + (live ? live.sender.latency_p95_ms : '') + ' ms'"></button>
          <div class="hist-pop" x-show="delayPop" x-cloak role="tooltip">
            <strong>DMX change → command sent</strong>
            <p class="muted small">Over the last <span x-text="delayHist().total"></span> commands.
              The pill shows the 95th percentile: 95% were this fast or faster.</p>
            <template x-for="b in delayHist().rows" :key="b.label">
              <div class="hist-row"><span class="mono small" x-text="b.label"></span>
                <span class="hist-bar"><span :style="`width:${b.pct}%`" :class="b.slow ? 'slow' : ''"></span></span>
                <span class="mono small" x-text="b.count"></span></div>
            </template>
            <p class="muted small mono" x-text="`median ${live.sender.latency_p50_ms} · p95 ${live.sender.latency_p95_ms} · max ${live.sender.latency_max_ms} ms`"></p>
            <p class="muted small" x-show="live.sender.frame_period_ms" x-text="`Sync round is ${live.sender.frame_period_ms} ms, so most changes wait 0–${Math.round(live.sender.frame_period_ms)} ms.`"></p>
          </div>
        </span>
        <span class="pill" x-show="live && live.sender.delivery_spread_p95_ms != null" title="How far apart bulbs receive the same DMX change (95th percentile)"
              x-text="'spread ' + (live ? live.sender.delivery_spread_p95_ms : '') + ' ms'"></span>
        <span class="pill bad" x-show="live && (live.input.malformed || live.input.oe || live.input.restarts)"><span class="dot"></span>
          <span x-text="inputProblems()"></span></span>
      </div>
      <nav class="tabs" aria-label="Sections">
        <template x-for="t in visibleTabs()" :key="t.id">
          <button type="button" @click="setTab(t.id)" :aria-current="tab === t.id ? 'page' : null" x-text="t.label"></button>
        </template>
      </nav>
    </div>
  </header>

  <main class="wrap">

    <!-- ================= LIVE ================= -->
    <div x-show="tab === 'live'">
      <div class="looks" x-show="Object.keys(cfg.looks).length">
        <template x-for="name in Object.keys(cfg.looks)" :key="name">
          <button class="btn" type="button" @click="recallLook(name)" x-text="name"></button>
        </template>
      </div>

      <div class="row" style="margin:12px 0">
        <button class="btn small" type="button" :aria-pressed="view === 'map'" @click="view = 'map'">Map</button>
        <button class="btn small" type="button" :aria-pressed="view === 'list'" @click="view = 'list'">List</button>
        <span style="flex:1"></span>
        <button class="btn small" type="button" :aria-pressed="selectMode" @click="selectMode = !selectMode; if (!selectMode) selected = []"
                x-text="selectMode ? 'Selecting (' + selected.length + ')' : 'Select'"></button>
        <button class="btn small" type="button" x-show="view === 'map'" :aria-pressed="editLayout" @click="editLayout = !editLayout"
                x-text="editLayout ? 'Done arranging' : 'Edit layout'"></button>
      </div>

      <div class="row" style="margin-bottom:10px" x-show="Object.keys(cfg.groups).length">
        <template x-for="g in Object.keys(cfg.groups)" :key="g">
          <button class="chip" type="button" @click="selectGroup(g)" x-text="g"></button>
        </template>
      </div>

      <div x-show="selectMode && selected.length" class="row" style="margin-bottom:10px">
        <span class="muted" x-text="selected.length + ' selected'"></span>
        <button class="btn small primary" type="button" @click="setTab('control')">Control selected</button>
        <button class="btn small" type="button" @click="selected = []">Clear</button>
      </div>

      <template x-if="view === 'map'">
        <div class="stack">
          <div class="stage" :class="editLayout && 'editing'" x-ref="stage">
            <template x-for="b in placedBulbs()" :key="b.mac">
              <div class="bulb" :class="{offline: !isOnline(b.mac), selected: selected.includes(b.mac)}"
                   :style="`left:${b.pos[0] * 100}%; top:${b.pos[1] * 100}%`"
                   @pointerdown="dragStart($event, b.mac)" @click="tapBulb(b.mac)">
                <div class="lamp" :style="lampStyle(b.mac)"></div>
                <span class="badge" :class="liveOf(b.mac).backoff && 'backoff'" x-show="badge(b.mac)" x-text="badge(b.mac)"></span>
                <span class="name" x-text="b.name"></span>
              </div>
            </template>
            <div class="stage-label">STAGE</div>
          </div>
          <div x-show="unplacedBulbs().length">
            <p class="muted" style="margin:0 0 6px" x-text="editLayout ? 'Drag these onto the map:' : 'Not placed yet (use Edit layout):'"></p>
            <div class="tray">
              <template x-for="b in unplacedBulbs()" :key="b.mac">
                <div class="bulb" :class="{offline: !isOnline(b.mac), selected: selected.includes(b.mac)}"
                     @pointerdown="dragStart($event, b.mac)" @click="tapBulb(b.mac)">
                  <div class="lamp" :style="lampStyle(b.mac)"></div>
                  <span class="name" x-text="b.name"></span>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>

      <template x-if="view === 'list'">
        <div class="table-wrap">
          <table>
            <thead><tr><th></th><th>Bulb</th><th>Ch</th><th>Source</th><th>Status</th><th>RTT</th></tr></thead>
            <tbody>
              <template x-for="b in bulbList()" :key="b.mac">
                <tr @click="tapBulb(b.mac)" style="cursor:pointer" :style="selected.includes(b.mac) && 'background:var(--panel-2)'">
                  <td><span class="swatch" :style="lampStyle(b.mac, true)"></span></td>
                  <td x-text="b.name"></td>
                  <td class="mono" x-text="channelLabel(b)"></td>
                  <td x-text="sourceLabel(b.mac)"></td>
                  <td><span class="status" :class="isOnline(b.mac) ? 'on' : 'off'" x-text="isOnline(b.mac) ? (liveOf(b.mac).backoff ? 'backed off' : 'online') : 'offline'"></span></td>
                  <td class="mono" x-text="liveOf(b.mac).rtt != null ? liveOf(b.mac).rtt + ' ms' : '–'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>

      <template x-if="live && live.ip_changes && live.ip_changes.length">
        <div style="margin-top:14px" class="stack">
          <template x-for="c in live.ip_changes.slice(-3)">
            <div class="warn-box" x-text="`${c[1]} moved from ${c[2] || '?'} to ${c[3]} (found by MAC)`"></div>
          </template>
        </div>
      </template>
      <h2>Looks</h2>
      <section class="card stack">
        <form class="row" @submit.prevent="saveLook()">
          <input id="lookname" type="text" placeholder="Look name, e.g. House lights" x-model="lookName">
          <button class="btn" type="submit" x-text="selected.length ? `Save ${selected.length} selected` : 'Save all bulbs'"></button>
        </form>
        <p class="muted small" style="margin:0" x-show="!Object.keys(cfg.looks).length">No looks yet. Set the bulbs how you want them, then save.</p>
        <template x-for="name in Object.keys(cfg.looks)" :key="name">
          <div class="row">
            <strong x-text="name" style="min-width:8em"></strong>
            <span class="muted" x-text="Object.keys(cfg.looks[name]).length + ' bulbs'"></span>
            <span style="flex:1"></span>
            <button class="btn small primary" type="button" @click="recallLook(name)">Recall</button>
            <button class="btn small danger" type="button" @click="deleteLook(name)">Delete</button>
          </div>
        </template>
      </section>
    </div>

    <!-- ================= BULBS ================= -->
    <div x-show="tab === 'bulbs'">
      <div class="stack" x-show="warnings.length" style="margin-bottom:10px">
        <template x-for="w in warnings"><div class="warn-box" x-text="w"></div></template>
      </div>

      <div class="toolbar">
        <input type="search" id="bulbsearch" placeholder="Search name, IP, MAC or channel" x-model="bulbFilter" aria-label="Search bulbs">
        <select id="groupfilter" x-model="bulbGroupFilter" aria-label="Filter by group">
          <option value="">All groups</option>
          <template x-for="g in Object.keys(cfg.groups)"><option :value="g" x-text="g"></option></template>
          <option value="__none">No group</option>
        </select>
        <select id="statusfilter" x-model="bulbStatusFilter" aria-label="Filter by status">
          <option value="">Any status</option>
          <option value="offline">Offline</option>
          <option value="update">Firmware update available</option>
          <option value="manual">Manual / look</option>
        </select>
        <button class="btn small primary" type="button" @click="discover()" :disabled="discovering" x-text="discovering ? 'Searching…' : 'Find bulbs'"></button>
        <button class="btn small" type="button" x-show="selected.length" @click="openAssign()"
                x-text="`Assign channels to ${selected.length} bulb${selected.length === 1 ? '' : 's'}…`"></button>
      </div>

      <template x-if="found">
        <section class="card" style="margin-top:10px">
          <div class="row"><span x-text="newFound().length ? newFound().length + ' new bulb(s) found' : 'No new bulbs found (' + found.length + ' known bulbs answered).'"></span>
            <span style="flex:1"></span><button class="btn small" type="button" @click="found = null">Close</button></div>
          <template x-for="f in newFound()" :key="f.mac">
            <div class="row" style="padding:6px 0; border-top:1px solid var(--line)">
              <span x-text="f.alias"></span><span class="muted mono" x-text="f.ip + ' · ' + f.model + ' · fw ' + (f.fw || '').split(' ')[0]"></span>
              <span style="flex:1"></span>
              <button class="btn small primary" type="button" @click="addBulb(f)">Add</button>
            </div>
          </template>
        </section>
      </template>

      <div class="table-wrap" style="margin-top:10px">
        <table class="bulbs-table slim">
          <thead><tr>
            <th><input type="checkbox" aria-label="Select all shown" :checked="filteredBulbs().length && filteredBulbs().every(b => selected.includes(b.mac))"
                       @change="selectShown($event.target.checked)"></th>
            <th></th><th>Name</th><th>Patch</th><th>DMX</th><th>Groups</th><th>Status</th><th></th>
          </tr></thead>
          <tbody>
            <template x-for="b in filteredBulbs()" :key="b.mac">
              <tr>
                <td><input type="checkbox" :checked="selected.includes(b.mac)" @change="toggleSelect(b.mac)" :aria-label="'Select ' + b.name"></td>
                <td><button type="button" class="lamp-btn" :class="!isOnline(b.mac) && 'off'" :style="lampStyle(b.mac, true)"
                            @click="openSheet(b.mac)" :aria-label="'Details for ' + b.name" :title="stateText(b.mac)"></button></td>
                <td class="name-cell"><button type="button" class="link" @click="openSheet(b.mac)" x-text="b.name"></button>
                  <span class="muted mono small" x-text="b.ip || 'no IP'"></span></td>
                <td>
                  <div class="row nowrap">
                    <select :id="'patch-' + b.mac" @change="setPatchMode(b, $event.target.value)" aria-label="Patch">
                      <option value="own" :selected="!b.follow && b.channel != null">Solo</option>
                      <template x-for="g in Object.keys(cfg.groups)"><option :value="'g:' + g" :selected="b.follow === g" x-text="'Group: ' + g"></option></template>
                      <option value="none" :selected="!b.follow && b.channel == null">Unpatched</option>
                    </select>
                    <input type="number" class="ch" min="1" max="510" :id="'ch-' + b.mac" x-show="!b.follow && b.channel != null" :value="b.channel ?? ''"
                           @change="editBulb(b.mac, {channel: $event.target.value === '' ? null : +$event.target.value})" aria-label="Start channel">
                    <span class="muted mono small" x-show="b.follow" x-text="b.follow && cfg.groups[b.follow] && cfg.groups[b.follow].channel ? 'ch ' + cfg.groups[b.follow].channel : 'no ch'"></span>
                  </div>
                </td>
                <td><label class="switch"><input type="checkbox" :checked="b.dmx" @change="editBulb(b.mac, {dmx: $event.target.checked})" :aria-label="'DMX for ' + b.name"></label></td>
                <td><button type="button" class="chip" @click="groupPopup = b.mac" x-text="b.groups.length ? b.groups.length + (b.groups.length === 1 ? ' group' : ' groups') : 'None'"
                            :title="b.groups.join(', ')"></button></td>
                <td class="status-cell">
                  <span class="status" :class="isOnline(b.mac) ? 'on' : 'off'" x-text="isOnline(b.mac) ? (liveOf(b.mac).backoff ? 'slowed' : 'online') : 'offline'"
                        :title="liveOf(b.mac).backoff ? 'Missed several replies in a row, so updates to this bulb are spaced out (now every ' + liveOf(b.mac).interval + ' ms) until it answers again' : ''"></span>
                  <span class="muted small mono" x-show="liveOf(b.mac).rtt != null" x-text="liveOf(b.mac).rtt + ' ms'"></span>
                  <span class="small mono" :class="fwUpdatable(b.mac) ? 'warn-text' : 'muted'" x-text="fwText(b.mac)"></span>
                </td>
                <td class="menu-cell">
                  <button type="button" class="btn small id-btn" @click="identify(b.mac)" :title="'Blink ' + b.name">Identify</button>
                  <button type="button" class="kebab" @click.stop="openMenu(b, $el)" :aria-label="'More for ' + b.name" :aria-expanded="menuFor === b.mac">⋮</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <p class="muted small" x-text="`Showing ${filteredBulbs().length} of ${bulbList().length} bulbs` + (selected.length ? ` · ${selected.length} selected` : '') + (totalPower() ? ` · about ${totalPower()} W in total` : '')"></p>

      <h2>Groups</h2>
      <section class="card stack">
        <template x-for="name in Object.keys(cfg.groups)" :key="name">
          <div class="row">
            <button type="button" class="lamp-btn" :style="groupSwatch(name)" @click="openGroupSheet(name)" :aria-label="'Control group ' + name" title="Control this group"></button>
            <strong x-text="name" style="min-width:8em"></strong>
            <label class="field inline"><span>Shared channel</span>
              <input type="number" min="1" max="510" :value="cfg.groups[name].channel ?? ''" @change="putGroup(name, $event.target.value === '' ? null : +$event.target.value)"></label>
            <span class="muted" x-text="bulbList().filter(b => b.groups.includes(name)).length + ' bulbs'"></span>
            <button class="btn small" type="button" @click="selectGroup(name)">Select</button>
            <button class="btn small danger" type="button" @click="deleteGroup(name)">Delete</button>
          </div>
        </template>
        <form class="row" @submit.prevent="addGroup()">
          <input id="newgroup" type="text" placeholder="New group name" x-model="newGroup">
          <button class="btn" type="submit">Add group</button>
        </form>
      </section>

      <h2>Power-on default</h2>
      <section class="card stack">
        <p class="muted" style="margin:0">What a bulb shows when its power is switched on, before this Pi has started.</p>
        <div class="row">
          <span x-text="'Applies to ' + (selected.length ? selected.length + ' selected' : 'all ' + bulbList().length) + ' bulb(s) · current: ' + powerOnSummary().text"></span>
        </div>
        <div class="row">
          <button class="btn small" type="button" :aria-pressed="powerOn.mode === 'white'" @click="powerOn.mode = 'white'">White</button>
          <button class="btn small" type="button" :aria-pressed="powerOn.mode === 'color'" @click="powerOn.mode = 'color'">Color</button>
          <button class="btn small" type="button" :aria-pressed="powerOn.mode === 'last'" @click="powerOn.mode = 'last'">Last state</button>
          <span class="swatch" x-show="powerOn.mode !== 'last'" :style="cssFromState(powerOn.mode === 'white' ? {k: powerOn.k, v: powerOn.v} : {h: powerOn.h, s: powerOn.s, v: powerOn.v}, true)"></span>
        </div>
        <div class="row" x-show="powerOn.mode === 'white'">
          <label class="field" style="flex:1; min-width:180px"><span x-text="'White ' + powerOn.k + ' K'"></span>
            <input id="pok" type="range" class="temp-range" min="2500" max="6500" step="50" x-model.number="powerOn.k"></label>
        </div>
        <div class="row" x-show="powerOn.mode === 'color'">
          <label class="field" style="flex:1; min-width:180px"><span x-text="'Hue ' + powerOn.h + '°'"></span>
            <input id="poh" type="range" class="hue-range" min="0" max="359" x-model.number="powerOn.h"></label>
          <label class="field" style="flex:1; min-width:140px"><span x-text="'Saturation ' + powerOn.s + '%'"></span>
            <input id="pos" type="range" min="0" max="100" x-model.number="powerOn.s"></label>
        </div>
        <div class="row" x-show="powerOn.mode !== 'last'">
          <label class="field" style="flex:1; min-width:180px"><span x-text="'Brightness ' + powerOn.v + '%'"></span>
            <input id="pov" type="range" min="1" max="100" x-model.number="powerOn.v"></label>
        </div>
        <p class="muted small" style="margin:0" x-show="powerOn.mode === 'last'">The bulb comes back on as it was when the power went off.</p>
        <div class="row"><button class="btn" type="button" @click="setPowerOn()" x-text="`Apply to ${targets(true).length} bulb(s)`"></button></div>
      </section>
    </div>

    <!-- ================= CONTROL BOARD ================= -->
    <div x-show="tab === 'board'">
      <div class="row" style="margin-bottom:10px">
        <span class="pill" :class="board && board.active ? 'ok' : ''"><span class="dot"></span>
          <span x-text="board && board.active ? 'Sending DMX through the Enttec' : 'Not sending (any change starts it)'"></span></span>
        <span class="muted small" x-show="board && board.error" x-text="board && board.error"></span>
        <span style="flex:1"></span>
        <button class="btn small" type="button" @click="boardBlackout()">Blackout</button>
        <button class="btn small" type="button" @click="boardRelease()" :disabled="!(board && board.active)" title="Stop sending, so a real desk can take over">Release</button>
      </div>
      <p class="muted" style="margin:0 0 12px">Sends real DMX out of the Enttec, so it travels the whole chain (shield, receiver, engine, bulbs) just like a desk.
        Bulbs follow it only if their DMX toggle is on; a manual color holds until the DMX changes.</p>

      <div class="row" style="margin-bottom:12px">
        <button class="btn small" type="button" :aria-pressed="boardMode === 'color'" @click="boardMode = 'color'; $nextTick(() => drawWheel($refs.boardwheel))">Color</button>
        <button class="btn small" type="button" :aria-pressed="boardMode === 'faders'" @click="boardMode = 'faders'">Faders</button>
        <button class="btn small" type="button" :aria-pressed="boardMode === 'shows'" @click="boardMode = 'shows'">Test shows</button>
      </div>

      <template x-if="board && !board.fixtures.length">
        <div class="warn-box">No patched fixtures yet. Give bulbs a channel (Solo) or a group a shared channel on the Bulbs tab.</div>
      </template>

      <!-- Color mode -->
      <div x-show="boardMode === 'color'" class="control">
        <div class="stack">
          <canvas class="wheel" width="520" height="520" x-ref="boardwheel" x-init="$nextTick(() => drawWheel($el))" @pointerdown="boardWheelPick($event)" @pointermove="$event.buttons && boardWheelPick($event)"></canvas>
          <label class="field"><span x-text="'Brightness ' + boardColor.v + '%'"></span>
            <input id="bbright" type="range" min="0" max="100" x-model.number="boardColor.v" @input="boardSendColor()"></label>
          <label class="field"><span x-text="'White ' + boardTemp + ' K'"></span>
            <input id="btemp" type="range" class="temp-range" min="2500" max="6500" step="50" x-model.number="boardTemp" @input="boardColorMode = 'temp'; boardSendColor()"></label>
        </div>
        <div class="stack">
          <div class="row">
            <strong>Fixtures</strong><span style="flex:1"></span>
            <button class="chip" type="button" @click="boardSel = board ? board.fixtures.map(f => f.channel) : []">All</button>
            <button class="chip" type="button" @click="boardSel = []">None</button>
          </div>
          <div class="fixture-list">
            <template x-for="f in (board ? board.fixtures : [])" :key="f.channel">
              <label class="switch"><input type="checkbox" :checked="boardSel.includes(f.channel)" @change="toggleBoardSel(f.channel)">
                <span x-text="f.label"></span><span class="muted mono small" x-text="'ch ' + f.channel"></span></label>
            </template>
          </div>
          <p class="muted small" style="margin:0" x-text="boardSel.length + ' fixture(s) selected'"></p>
        </div>
      </div>

      <!-- Fader mode -->
      <div x-show="boardMode === 'faders'" class="faders">
        <template x-for="f in (board ? board.fixtures : [])" :key="f.channel">
          <div class="fader-group">
            <div class="row"><strong x-text="f.label"></strong><span class="muted mono small" x-text="'ch ' + f.channel + '–' + (f.channel + 2)"></span>
              <span class="swatch" :style="boardSwatch(f)"></span></div>
            <label class="field"><span x-text="'Hue ' + f.h"></span>
              <input type="range" min="0" max="255" :value="f.h" @input="f.h = +$event.target.value; boardFader(f.channel, +$event.target.value)"></label>
            <label class="field"><span x-text="'Saturation ' + f.s"></span>
              <input type="range" min="0" max="255" :value="f.s" @input="f.s = +$event.target.value; boardFader(f.channel + 1, +$event.target.value)"></label>
            <label class="field"><span x-text="'Brightness ' + f.v"></span>
              <input type="range" min="0" max="255" :value="f.v" @input="f.v = +$event.target.value; boardFader(f.channel + 2, +$event.target.value)"></label>
          </div>
        </template>
      </div>

      <!-- Test shows -->
      <div x-show="boardMode === 'shows'" class="stack">
        <div class="show-grid">
          <template x-for="sh in (board ? board.shows : [])" :key="sh.id">
            <button class="btn" type="button" :aria-pressed="board && board.show === sh.id" @click="boardShow(sh.id)" x-text="sh.label"></button>
          </template>
        </div>
        <label class="field" style="max-width:420px"><span x-text="'Speed ×' + boardSpeed"></span>
          <input id="bspeed" type="range" min="0.25" max="4" step="0.25" x-model.number="boardSpeed" @change="board && board.show && boardShow(board.show)"></label>
        <div class="row">
          <button class="btn" type="button" @click="boardStopShow()" :disabled="!(board && board.show)">Stop show</button>
          <span class="muted" x-text="board && board.show ? 'Running: ' + board.shows.find(x => x.id === board.show).label : 'No show running'"></span>
        </div>
        <p class="muted small" style="margin:0">Tip: watch the header's "spread" while a show runs to see how in sync the bulbs are.</p>
      </div>
    </div>

    <!-- ================= SETUP ================= -->
    <div x-show="tab === 'setup'">
      <form class="stack" @submit.prevent="saveSettings()">
        <h2>Sending to bulbs</h2>
        <section class="card row">
          <label class="field"><span>Total packet budget (packets/s for all bulbs together)</span><input id="budget" type="number" min="1" max="5000" x-model.number="settings.sender.budget_pps"></label>
          <label class="field"><span>Per-bulb minimum interval (ms)</span><input id="mininterval" type="number" min="10" max="2000" x-model.number="settings.sender.min_interval_ms"></label>
          <p class="muted small" style="margin:0" x-text="rateSummary()"></p>
          <label class="field"><span>Maximum backoff (ms)</span><input id="maxbackoff" type="number" min="10" max="60000" x-model.number="settings.sender.max_backoff_ms"></label>
          <label class="field"><span>Re-send unconfirmed after (s)</span><input id="refresh" type="number" min="0.2" max="60" step="0.1" x-model.number="settings.sender.refresh_s"></label>
          <label class="field"><span>Lost replies before slowing a bulb</span><input id="backoffafter" type="number" min="1" max="50" x-model.number="settings.sender.backoff_after"></label>
          <label class="field"><span>Check idle bulbs every (s)</span><input id="idlecheck" type="number" min="0.5" max="300" step="0.5" x-model.number="settings.sender.idle_check_s"></label>
          <label class="field"><span>WiFi priority for bulb commands</span>
            <select id="wifiprio" x-model="settings.sender.wifi_priority">
              <option value="off">Normal</option><option value="video">Video</option><option value="voice">Voice (highest)</option>
            </select></label>
        </section>

        <h2>Smoothness</h2>
        <section class="card row">
          <label class="field"><span>Send mode</span>
            <select id="sendmode" x-model="settings.sender.mode">
              <option value="sync">Sync: all bulbs change together</option>
              <option value="priority">Priority: biggest change first</option>
            </select></label>
          <label class="field" :class="settings.sender.adaptive_transition && 'muted'"><span>Fade time per update (ms)</span>
            <input id="fixedtr" type="number" min="0" max="10000" step="5" x-model.number="settings.sender.fixed_transition_ms" :disabled="settings.sender.adaptive_transition"></label>
          <label class="switch"><input id="adaptive" type="checkbox" x-model="settings.sender.adaptive_transition"> Smooth fades (experimental)</label>
          <label class="field" x-show="settings.sender.adaptive_transition"><span>Snap above (0–1 change)</span><input id="snap" type="number" min="0" max="1" step="0.05" x-model.number="settings.sender.snap_threshold"></label>
          <p class="muted" style="margin:0; flex-basis:100%">Each bulb blends to every new color over the fade time (the old app used 30 ms). Smooth fades instead stretch each blend over the time until the next update; smoother, but the bulb lags a little.</p>
          <label class="field"><span>Brightness curve</span>
            <select id="curve" x-model="settings.sender.curve"><option value="linear">Linear</option><option value="square">Square law</option><option value="scurve">S-curve</option></select></label>
        </section>

        <h2>When DMX stops</h2>
        <section class="card row">
          <label class="field"><span>Behavior</span>
            <select id="lossmode" x-model="settings.dmx_loss.mode"><option value="hold">Hold the last look</option><option value="look">Recall a look</option><option value="blackout">Blackout</option></select></label>
          <label class="field" x-show="settings.dmx_loss.mode !== 'hold'"><span>After (s)</span><input id="lossafter" type="number" min="1" max="3600" x-model.number="settings.dmx_loss.after_s"></label>
          <label class="field" x-show="settings.dmx_loss.mode === 'look'"><span>Look</span>
            <select id="losslook" x-model="settings.dmx_loss.look"><template x-for="n in Object.keys(cfg.looks)"><option :value="n" x-text="n"></option></template></select></label>
        </section>

        <h2>Identify</h2>
        <section class="card row">
          <label class="field"><span>Blinks per second</span><input id="identhz" type="number" min="0.2" max="10" step="0.1" x-model.number="settings.identify.blink_hz"></label>
          <label class="field"><span>Duration (s)</span><input id="identdur" type="number" min="0.5" max="60" step="0.5" x-model.number="settings.identify.duration_s"></label>
        </section>

        <h2>Show network</h2>
        <section class="card row">
          <label class="field"><span>Network name</span><input id="netssid" type="text" x-model="settings.network.ssid"></label>
          <label class="field"><span>Password</span><input id="netpw" type="password" x-model="settings.network.password"></label>
        </section>

        <div class="row"><button class="btn primary" type="submit">Save settings</button></div>
      </form>

      <h2>Backup</h2>
      <section class="card row">
        <a class="btn" href="/api/backup">Download backup</a>
        <label class="btn">Restore from file… <input type="file" accept=".json,application/json" hidden @change="restore($event)"></label>
      </section>

      <h2>Password</h2>
      <form class="card row" @submit.prevent="changePassword()">
        <input id="curpw" type="password" placeholder="Current password" x-model="pwChange.current" autocomplete="current-password">
        <input id="newpw" type="password" placeholder="New password" x-model="pwChange.next" autocomplete="new-password">
        <button class="btn" type="submit">Change password</button>
        <button class="btn" type="button" @click="logout()">Log out</button>
      </form>

      <h2>Bulb firmware on this Pi</h2>
      <section class="card">
        <p class="muted" style="margin:0" x-show="!fwImages.length">None downloaded. Run <span class="mono">python -m engine firmware fetch</span> on the Pi while it has internet.</p>
        <template x-for="img in fwImages"><div x-text="`${img.model} hw ${img.hw_ver}: ${img.version}`"></div></template>
        <p class="muted" style="margin:8px 0 0" x-show="fwImages.length">Update bulbs from the Bulbs tab (Firmware button). Not while a show is running.</p>
      </section>
    </div>
  </main>

  <!-- ================= DMX input popup ================= -->
  <template x-if="dmxPopup && live">
    <div class="backdrop" @click.self="dmxPopup = false">
      <div class="sheet stack" role="dialog" aria-modal="true" aria-label="DMX input">
        <div class="row"><strong>DMX input</strong><span style="flex:1"></span>
          <button class="btn small" type="button" @click="dmxPopup = false">Close</button></div>
        <label class="switch big"><input id="dmxenabled" type="checkbox" :checked="live.dmx_enabled" @change="setDmxEnabled($event.target.checked)">
          <span x-text="live.dmx_enabled ? 'DMX controls the bulbs' : 'DMX is ignored: bulbs keep their current state'"></span></label>
        <p class="muted small" style="margin:0">Turning DMX off lets you set bulbs by hand without the desk overriding them. It turns back on by itself if the Pi restarts.</p>
        <dl class="facts">
          <dt>Signal</dt><dd x-text="live.dmx ? 'receiving' : (live.last_frame_age_s != null ? 'none for ' + live.last_frame_age_s + ' s' : 'never received')"></dd>
          <dt>Frames/s</dt><dd x-text="live.dmx ? fps : 0"></dd>
          <dt>Frames received</dt><dd x-text="live.input.frames"></dd>
          <dt>Channels per frame</dt><dd x-text="live.input.slots || '—'"></dd>
          <dt>Bad frames</dt><dd x-text="live.input.malformed"></dd>
          <dt>Held glitch frames</dt><dd x-text="live.input.held"></dd>
          <dt>Other start codes</dt><dd x-text="live.input.other_sc || 0"></dd>
          <dt>UART overruns</dt><dd x-text="live.input.oe"></dd>
          <dt>Receiver restarts</dt><dd x-text="live.input.restarts"></dd>
          <dt>When DMX stops</dt><dd x-text="({hold: 'hold the last state', look: 'recall a look', blackout: 'blackout'})[cfg.dmx_loss.mode] + (cfg.dmx_loss.mode !== 'hold' ? ' after ' + cfg.dmx_loss.after_s + ' s' : '')"></dd>
        </dl>
      </div>
    </div>
  </template>

  <!-- ================= bulb row menu (outside the table so it is never clipped) ================= -->
  <template x-if="menuFor && cfg.bulbs[menuFor]">
    <div class="menu" :style="`left:${menuPos.x}px; top:${menuPos.y}px`" @click.outside="menuFor = null"
         @scroll.window="menuFor = null" @resize.window="menuFor = null">
      <div class="menu-info stats">
        <template x-for="[k, v] in bulbStats(menuFor)" :key="k">
          <div class="stat"><span class="muted" x-text="k"></span><span class="mono" x-text="v"></span></div>
        </template>
      </div>
      <div class="menu-info"><span class="muted">Power-on default</span><br><span x-text="powerOnText(menuFor)"></span></div>
      <button type="button" x-show="fwImages.length" @click="const m = menuFor; menuFor = null; updateFirmware(m)"
              x-text="fwUpdatable(menuFor) ? 'Update firmware' : 'Re-install firmware'"></button>
      <button type="button" class="danger" @click="const b = bulbList().find(x => x.mac === menuFor); menuFor = null; removeBulb(b)">Remove</button>
    </div>
  </template>

  <!-- ================= assign channels ================= -->
  <template x-if="assign">
    <div class="backdrop" @click.self="assign = null">
      <div class="sheet stack" role="dialog" aria-modal="true" aria-label="Assign DMX channels">
        <div class="row"><strong>Assign DMX channels</strong><span style="flex:1"></span>
          <button class="btn small" type="button" @click="assign = null">Cancel</button></div>
        <p class="muted small" style="margin:0">Each bulb takes 3 channels (hue, saturation, brightness). The selected bulbs get
          consecutive addresses from the start channel, skipping channels other bulbs and groups already use, and are set to Solo.</p>
        <label class="field" style="max-width:200px"><span>Start at channel</span>
          <input id="assignstart" type="number" min="1" max="510" x-model.number="assign.start"></label>
        <div class="assign-preview">
          <template x-for="row in assignPreview()" :key="row.mac">
            <div class="row nowrap"><span x-text="row.name" class="assign-name"></span>
              <span class="mono" :class="row.ch ? '' : 'warn-text'" x-text="row.ch ? 'ch ' + row.ch + '–' + (row.ch + 2) : 'no room'"></span></div>
          </template>
        </div>
        <div class="row"><button class="btn primary" type="button" @click="autoAssign()" :disabled="assignPreview().some(r => !r.ch)"
                 x-text="`Assign ${selected.length} bulb${selected.length === 1 ? '' : 's'}`"></button></div>
      </div>
    </div>
  </template>

  <!-- ================= group picker ================= -->
  <template x-if="groupPopup && cfg.bulbs[groupPopup]">
    <div class="backdrop" @click.self="groupPopup = null">
      <div class="sheet stack" role="dialog" aria-modal="true" :aria-label="'Groups for ' + cfg.bulbs[groupPopup].name">
        <div class="row"><strong x-text="'Groups for ' + cfg.bulbs[groupPopup].name"></strong><span style="flex:1"></span>
          <button class="btn small" type="button" @click="groupPopup = null">Done</button></div>
        <p class="muted" style="margin:0" x-show="!Object.keys(cfg.groups).length">No groups yet. Add one below.</p>
        <template x-for="g in Object.keys(cfg.groups)" :key="g">
          <label class="switch"><input type="checkbox" :checked="cfg.bulbs[groupPopup].groups.includes(g)"
                 @change="toggleGroup({mac: groupPopup, groups: cfg.bulbs[groupPopup].groups}, g)"> <span x-text="g"></span></label>
        </template>
        <form class="row" @submit.prevent="addGroup(groupPopup)">
          <input id="newgroup2" type="text" placeholder="New group" x-model="newGroup">
          <button class="btn small" type="submit">Add and assign</button>
        </form>
      </div>
    </div>
  </template>

  <!-- ================= bulb / group sheet ================= -->
  <template x-if="(sheet && cfg.bulbs[sheet]) || (groupSheet && cfg.groups[groupSheet])">
    <div class="backdrop" @click.self="closeSheet()">
      <div class="sheet stack" role="dialog" aria-modal="true" :aria-label="sheet ? cfg.bulbs[sheet].name : 'Group ' + groupSheet">
        <div class="row">
          <span class="swatch" style="width:28px;height:28px" :style="sheet ? lampStyle(sheet, true) : groupSwatch(groupSheet)"></span>
          <strong x-text="sheet ? cfg.bulbs[sheet].name : 'Group: ' + groupSheet"></strong>
          <span class="muted mono" x-text="sheet ? channelLabel(cfg.bulbs[sheet]) : groupMembers(groupSheet).length + ' bulbs'"></span>
          <span style="flex:1"></span>
          <button class="btn small" type="button" @click="closeSheet()">Close</button>
        </div>

        <template x-if="sheet">
          <div class="stack">
            <div class="row muted" style="font-size:14px">
              <span x-text="isOnline(sheet) ? 'Online' : 'Offline'"></span>·
              <span x-text="sourceLabel(sheet)"></span>·
              <span x-text="stateText(sheet)"></span>
            </div>
            <label class="field"><span>Name</span>
              <input id="sheetname" type="text" :value="cfg.bulbs[sheet].name" @change="editBulb(sheet, {name: $event.target.value})"></label>
            <dl class="facts">
              <dt>IP</dt><dd class="mono" x-text="cfg.bulbs[sheet].ip || '—'"></dd>
              <dt>MAC</dt><dd class="mono" x-text="sheet"></dd>
              <dt>Model</dt><dd x-text="(info[sheet] && info[sheet].model) || '—'"></dd>
              <dt>Firmware</dt><dd x-text="fwText(sheet)"></dd>
              <dt>Signal</dt><dd x-text="info[sheet] && info[sheet].rssi != null ? info[sheet].rssi + ' dBm' : '—'"></dd>
              <dt>Round trip</dt><dd x-text="liveOf(sheet).rtt != null ? liveOf(sheet).rtt + ' ms' : '—'"></dd>
              <dt>Power-on</dt><dd x-text="powerOnText(sheet)"></dd>
              <dt>Power draw</dt><dd x-text="powerText(sheet)"></dd>
              <dt>Groups</dt><dd><button type="button" class="chip" @click="groupPopup = sheet"
                   x-text="cfg.bulbs[sheet].groups.length ? cfg.bulbs[sheet].groups.join(', ') : 'None'"></button></dd>
            </dl>
            <label class="switch"><input type="checkbox" :checked="cfg.bulbs[sheet].dmx" @change="editBulb(sheet, {dmx: $event.target.checked})"> Follows DMX</label>
          </div>
        </template>
        <template x-if="groupSheet">
          <p class="muted small" style="margin:0" x-text="groupMembers(groupSheet).map(m => cfg.bulbs[m].name).join(', ') || 'No bulbs in this group yet.'"></p>
        </template>

        <canvas class="wheel sheet-wheel" width="400" height="400" x-init="$nextTick(() => drawWheel($el))"
                @pointerdown="wheelPick($event)" @pointermove="$event.buttons && wheelPick($event)"></canvas>
        <label class="field"><span x-text="'Brightness ' + color.v + '%'"></span>
          <input type="range" min="0" max="100" x-model.number="color.v" @input="sendColor()"></label>
        <label class="field"><span x-text="'White ' + temp + ' K'"></span>
          <input type="range" class="temp-range" min="2500" max="6500" step="50" x-model.number="temp" @input="sendTemp()"></label>
        <div class="row">
          <template x-for="p in presets"><button class="btn small" type="button" @click="applyPreset(p)" x-text="p.label"></button></template>
        </div>
        <div class="row">
          <button class="btn" type="button" @click="sheet ? identify(sheet) : groupMembers(groupSheet).forEach(m => identify(m))"
                  x-text="sheet ? 'Identify' : 'Identify all'"></button>
          <span class="muted small">A manual color holds until the bulb's DMX changes ("DMX wins").</span>
        </div>
      </div>
    </div>
  </template>
</div>
</template>

<div class="toast" :class="toast && toast.error && 'error'" x-show="toast" x-cloak x-text="toast && toast.text" role="status"></div>
</body>
</html>
