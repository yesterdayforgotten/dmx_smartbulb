<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 610" width="1240" height="610" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- Opaque background so the diagram is readable in GitHub dark mode -->
  <rect width="1240" height="610" fill="#ffffff"/>

  <text x="620" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">dmx_smartbulb wiring</text>

  <!-- ===== DMX console ===== -->
  <rect x="20" y="200" width="115" height="60" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="1.5"/>
  <text x="77" y="235" text-anchor="middle" fill="#222">DMX console</text>
  <line x1="135" y1="230" x2="196" y2="230" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="166" y="222" text-anchor="middle" font-size="11" fill="#444">DMX512</text>
  <line x1="200" y1="300" x2="139" y2="300" stroke="#444" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="135" y="320" text-anchor="end" font-size="11" fill="#444">thru to next fixture</text>

  <!-- ===== DMX shield ===== -->
  <rect x="200" y="110" width="240" height="380" rx="10" fill="#e3eefa" stroke="#2a5d9f" stroke-width="2"/>
  <text x="320" y="135" text-anchor="middle" font-weight="bold" fill="#1d3f6e">CQRobot DMX Shield</text>
  <text x="320" y="153" text-anchor="middle" font-size="11" fill="#1d3f6e">CTC-DRA-10-R2</text>

  <circle cx="200" cy="230" r="5" fill="#2a5d9f"/>
  <text x="212" y="234" fill="#222">XLR In (male)</text>
  <circle cx="200" cy="300" r="5" fill="#2a5d9f"/>
  <text x="212" y="304" fill="#222">XLR Thru (female)</text>

  <circle cx="440" cy="185" r="5" fill="#2a5d9f"/>
  <text x="428" y="189" text-anchor="end" fill="#222">5V</text>
  <circle cx="440" cy="220" r="5" fill="#2a5d9f"/>
  <text x="428" y="224" text-anchor="end" fill="#222">GND</text>
  <circle cx="440" cy="400" r="5" fill="#2a5d9f"/>
  <text x="428" y="404" text-anchor="end" fill="#222">RX0</text>

  <text x="320" y="455" text-anchor="middle" font-size="11" fill="#444">Jumpers: EN · Slave</text>
  <text x="320" y="471" text-anchor="middle" font-size="11" fill="#444">TX-uart · RX-uart</text>

  <!-- ===== ESP32 ===== -->
  <rect x="540" y="235" width="200" height="245" rx="10" fill="#ececec" stroke="#333" stroke-width="2"/>
  <text x="640" y="260" text-anchor="middle" font-weight="bold" fill="#222">ESP32 DevKit</text>
  <text x="640" y="276" text-anchor="middle" font-size="11" fill="#444">30-pin, WROOM-32</text>

  <circle cx="740" cy="305" r="5" fill="#333"/>
  <text x="728" y="309" text-anchor="end" fill="#222">VIN</text>
  <circle cx="740" cy="345" r="5" fill="#333"/>
  <text x="728" y="349" text-anchor="end" fill="#222">GND (next to VIN)</text>
  <circle cx="540" cy="400" r="5" fill="#333"/>
  <text x="552" y="404" fill="#222">GPIO16 (RX2)</text>
  <circle cx="740" cy="440" r="5" fill="#333"/>
  <text x="728" y="444" text-anchor="end" fill="#222">GPIO14 (TX)</text>

  <!-- ===== Raspberry Pi 4 ===== -->
  <rect x="860" y="110" width="220" height="380" rx="10" fill="#e6f4e6" stroke="#2e7d32" stroke-width="2"/>
  <text x="970" y="135" text-anchor="middle" font-weight="bold" fill="#1b5e20">Raspberry Pi 4</text>
  <text x="970" y="153" text-anchor="middle" font-size="11" fill="#1b5e20">40-pin GPIO header</text>

  <circle cx="860" cy="185" r="5" fill="#2e7d32"/>
  <text x="872" y="189" fill="#222">Pin 4 · 5V</text>
  <circle cx="860" cy="220" r="5" fill="#2e7d32"/>
  <text x="872" y="224" fill="#222">Pin 6 · GND</text>
  <circle cx="860" cy="305" r="5" fill="#2e7d32"/>
  <text x="872" y="309" fill="#222">Pin 2 · 5V</text>
  <circle cx="860" cy="345" r="5" fill="#2e7d32"/>
  <text x="872" y="349" fill="#222">Pin 9 · GND</text>
  <circle cx="860" cy="440" r="5" fill="#2e7d32"/>
  <text x="872" y="444" fill="#222">Pin 29 · GPIO5 (RXD3)</text>

  <!-- USB-C power and Ethernet -->
  <line x1="930" y1="560" x2="930" y2="494" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="930" y="580" text-anchor="middle" font-size="12" fill="#222">USB-C 5 V supply</text>
  <line x1="1080" y1="300" x2="1136" y2="300" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1142" y="296" font-size="12" fill="#222">Ethernet</text>
  <text x="1142" y="312" font-size="12" fill="#222">to LAN /</text>
  <text x="1142" y="328" font-size="12" fill="#222">Kasa bulbs</text>

  <!-- ===== Wires ===== -->
  <!-- Pi pin 4 5V -> shield 5V -->
  <line x1="445" y1="185" x2="855" y2="185" stroke="#d32f2f" stroke-width="3"/>
  <!-- Pi pin 6 GND -> shield GND -->
  <line x1="445" y1="220" x2="855" y2="220" stroke="#111" stroke-width="3"/>

  <!-- Pi pin 2 5V -> diode -> ESP32 VIN -->
  <line x1="745" y1="305" x2="785" y2="305" stroke="#d32f2f" stroke-width="3"/>
  <line x1="811" y1="305" x2="855" y2="305" stroke="#d32f2f" stroke-width="3"/>
  <!-- Diode: anode on the Pi side (right), cathode bar toward the ESP32 (left) -->
  <polygon points="811,295 811,315 787,305" fill="#111"/>
  <line x1="786" y1="294" x2="786" y2="316" stroke="#111" stroke-width="3"/>
  <text x="799" y="285" text-anchor="middle" font-size="11" fill="#222">1N5822</text>
  <text x="799" y="331" text-anchor="middle" font-size="10" fill="#666">3 A 40 V Schottky</text>

  <!-- Pi pin 9 GND -> ESP32 GND -->
  <line x1="745" y1="345" x2="855" y2="345" stroke="#111" stroke-width="3"/>

  <!-- Shield RX0 -> ESP32 GPIO16 -->
  <line x1="445" y1="400" x2="535" y2="400" stroke="#e0a800" stroke-width="3"/>
  <text x="490" y="392" text-anchor="middle" font-size="11" fill="#444">DMX data</text>

  <!-- ESP32 GPIO14 -> Pi pin 29 -->
  <line x1="745" y1="440" x2="855" y2="440" stroke="#e0a800" stroke-width="3"/>
  <text x="800" y="432" text-anchor="middle" font-size="11" fill="#444">"DMX#" frames</text>
  <text x="800" y="458" text-anchor="middle" font-size="10" fill="#666">921600 8N1</text>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="560" x2="75" y2="560" stroke="#d32f2f" stroke-width="3"/>
  <text x="83" y="564" font-size="12" fill="#222">5 V</text>
  <line x1="130" y1="560" x2="165" y2="560" stroke="#111" stroke-width="3"/>
  <text x="173" y="564" font-size="12" fill="#222">GND</text>
  <line x1="225" y1="560" x2="260" y2="560" stroke="#e0a800" stroke-width="3"/>
  <text x="268" y="564" font-size="12" fill="#222">Signal (3.3 V / 5 V logic)</text>
  <text x="40" y="588" font-size="11" fill="#666">Grounds for the shield and ESP32 both run back to the Pi. The diode wire is red, covered in black heat-shrink.</text>
</svg>
