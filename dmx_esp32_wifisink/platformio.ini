; WiFi airtime stand-in for load tests: joins the show WiFi and answers every
; UDP packet on port 9999 with a KL135-sized reply. tools/fake_bulbs.py
; --mirror ESP32_IP:9999 sends it a copy of every simulated bulb's traffic, so
; the access point carries a realistic multi-bulb load.
; src/secrets.h (git-ignored) is written by tools/wifisink_secrets.py.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
